services:
  - type: web
    name: amortix-prime
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MONGODB_URI
        sync: false # Set this in Render Dashboard pointing to your MongoDB Atlas cluster URI
