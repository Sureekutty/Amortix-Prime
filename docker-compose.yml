version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: amortix-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: amortix_prime_db
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    container_name: amortix-prime-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGODB_URI=mongodb://mongodb:27017/amortix_prime_db
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - mongodb

volumes:
  mongo-data:
