version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: amortix-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: amortix_prime_db
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: .
    container_name: amortix-prime-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/amortix_prime_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - mysql

volumes:
  mysql-data:
