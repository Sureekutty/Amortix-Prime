<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: main('Member Portfolio', ~{::content})}">
<body>
<div th:fragment="content">

    <div class="card">
        <div class="card-header">
            <div class="card-title">Cooperative Members Directory</div>
            <a th:href="@{/members/new}" class="btn btn-primary btn-sm">➕ Register New Member</a>
        </div>

        <!-- Zero-JS Search Form -->
        <form th:action="@{/members}" method="get" style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="text" name="search" th:value="${search}" placeholder="Search by Member Code, Emp ID, or Full Name..." style="max-width: 400px;">
            <button type="submit" class="btn btn-secondary">Filter</button>
            <a th:if="${search}" th:href="@{/members}" class="btn btn-secondary">Reset</a>
        </form>

        <div class="table-responsive">
            <table>
                <thead>
                <tr>
                    <th>Member Code</th>
                    <th>Full Name</th>
                    <th>Emp ID</th>
                    <th>Department</th>
                    <th>Basic Pay</th>
                    <th>Shares Held</th>
                    <th>Thrift Balance</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${membersPage.content}">
                    <td><strong th:text="${m.memberCode}" style="color: var(--primary);">MEM-1001</strong></td>
                    <td th:text="${m.fullName}">Full Name</td>
                    <td th:text="${m.employeeCode}">EMP-1234</td>
                    <td th:text="${m.department}">Dept</td>
                    <td th:text="'₹' + ${m.basicPay}">₹0.00</td>
                    <td th:text="${m.totalShares}">0</td>
                    <td th:text="'₹' + ${m.thriftBalance}">₹0.00</td>
                    <td>
                        <span th:class="'badge ' + (${m.status == 'ACTIVE'} ? 'badge-success' : 'badge-danger')"
                              th:text="${m.status}">ACTIVE</span>
                    </td>
                    <td>
                        <a th:href="@{'/members/view/' + ${m.memberCode}}" class="btn btn-secondary btn-sm">View 360°</a>
                        <a th:if="${m.status == 'ACTIVE'}" th:href="@{'/members/settle/' + ${m.memberCode}}" class="btn btn-danger btn-sm" style="margin-left: 4px;">Settle</a>
                    </td>
                </tr>
                <tr th:if="${membersPage.empty}">
                    <td colspan="9" style="text-align: center; color: var(--text-dim); padding: 30px;">
                        No members found matching search criteria.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination" th:if="${membersPage.totalPages > 1}">
            <a th:if="${membersPage.hasPrevious()}"
               th:href="@{/members(page=${membersPage.number - 1}, search=${search})}" class="page-item">&laquo; Prev</a>
            <span class="page-item active" th:text="${membersPage.number + 1}">1</span>
            <a th:if="${membersPage.hasNext()}"
               th:href="@{/members(page=${membersPage.number + 1}, search=${search})}" class="page-item">Next &raquo;</a>
        </div>
    </div>

</div>
</body>
</html>
