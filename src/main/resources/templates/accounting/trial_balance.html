<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: main('General Ledger Trial Balance', ~{::content})}">
<body>
<div th:fragment="content">

    <div class="card">
        <div class="card-header">
            <div>
                <div class="card-title">Cooperative General Ledger — Trial Balance</div>
                <div style="font-size: 0.82rem; color: var(--text-dim);" th:text="'As of: ' + ${report.asOfDate}">Date</div>
            </div>
            <div>
                <span th:class="'badge ' + (${report.isBalanced} ? 'badge-success' : 'badge-danger')"
                      th:text="${report.isBalanced ? 'TRIAL BALANCE IN BALANCE' : 'UNBALANCED VARIANCE'}">BALANCED</span>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                <tr>
                    <th>Account Code</th>
                    <th>Ledger Account Title</th>
                    <th>Classification</th>
                    <th style="text-align: right;">Debit Balance (INR)</th>
                    <th style="text-align: right;">Credit Balance (INR)</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="it : ${report.items}">
                    <td><strong th:text="${it.code}" style="color: var(--primary);">1001</strong></td>
                    <td th:text="${it.name}">Cash in Hand</td>
                    <td><span class="badge badge-info" th:text="${it.type}">ASSET</span></td>
                    <td style="text-align: right; font-weight: 600;" th:text="${it.debitBalance > 0 ? '₹' + it.debitBalance : '-'}">-</td>
                    <td style="text-align: right; font-weight: 600;" th:text="${it.creditBalance > 0 ? '₹' + it.creditBalance : '-'}">-</td>
                </tr>
                <tr style="background: rgba(15, 23, 42, 0.8); font-weight: 800; border-top: 2px solid var(--border-color);">
                    <td colspan="3" style="text-transform: uppercase; letter-spacing: 1px; color: var(--text-main);">Total Trial Balance Sum</td>
                    <td style="text-align: right; color: #34d399; font-size: 1.05rem;" th:text="'₹' + ${report.totalDebits}">₹0.00</td>
                    <td style="text-align: right; color: #34d399; font-size: 1.05rem;" th:text="'₹' + ${report.totalCredits}">₹0.00</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
