<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: main('Member Thrift Passbook', ~{::content})}">
<body>
<div th:fragment="content">

    <div class="card">
        <div class="card-header">
            <div>
                <h3 th:text="${member.fullName} + ' — Thrift Fund Passbook'" style="color: var(--text-main); font-size: 1.4rem;">Passbook</h3>
                <span th:text="${member.memberCode} + ' | Emp ID: ' + ${member.employeeCode}" style="color: var(--primary); font-weight: 700;">Code</span>
            </div>
            <a th:href="@{/thrift}" class="btn btn-secondary btn-sm">← Back to Thrift Pool</a>
        </div>

        <div class="grid-stats" style="margin-bottom: 24px;">
            <div style="background: rgba(15, 23, 42, 0.4); padding: 14px; border-radius: var(--radius-sm);">
                <div class="stat-label">Accumulated Balance</div>
                <div class="stat-value" th:text="'₹' + ${member.thriftBalance}" style="color: #34d399;">₹0.00</div>
            </div>
            <div style="background: rgba(15, 23, 42, 0.4); padding: 14px; border-radius: var(--radius-sm);">
                <div class="stat-label">Monthly Compulsory Subscription</div>
                <div class="stat-value" th:text="'₹' + ${member.monthlyThriftAmount}">₹0.00</div>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Transaction Type</th>
                    <th>Amount Credited</th>
                    <th>Running Thrift Balance</th>
                    <th>Cycle Run / Ref</th>
                    <th>Narration</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${transactions}">
                    <td th:text="${t.txnDate}">Date</td>
                    <td><span class="badge badge-info" th:text="${t.txnType}">SUBSCRIPTION</span></td>
                    <td th:text="'₹' + ${t.amount}" style="font-weight: 700; color: #34d399;">₹0.00</td>
                    <td th:text="'₹' + ${t.balanceAfterTxn}">₹0.00</td>
                    <td th:text="${t.recoveryRunId != null ? t.recoveryRunId : t.voucherOrReceiptNo}">-</td>
                    <td th:text="${t.remarks}">Remarks</td>
                </tr>
                <tr th:if="${transactions.isEmpty()}">
                    <td colspan="6" style="text-align: center; color: var(--text-dim); padding: 20px;">No thrift transaction history.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
