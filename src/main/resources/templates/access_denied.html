<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: main('Access Denied', ~{::content})}">
<body>
<div th:fragment="content">

    <div class="card" style="max-width: 650px; margin: 40px auto; text-align: center; padding: 40px 30px;">
        <div style="font-size: 3.5rem; margin-bottom: 16px;">🛡️</div>
        <h2 style="color: var(--danger); font-size: 1.6rem; margin-bottom: 12px;">Access Restricted (403 Forbidden)</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px;">
            You do not have the required role privileges or data ownership permissions to view or perform operations on this resource.
            Member data isolation and role boundaries are strictly enforced across AMORTIX | PRIME.
        </p>

        <div th:if="${errorMessage}" class="alert alert-danger" style="text-align: left; margin-bottom: 24px;">
            <span>⚠</span>
            <span th:text="${errorMessage}">Access Denied Details</span>
        </div>

        <div style="display: flex; gap: 12px; justify-content: center;">
            <a th:href="@{/dashboard}" class="btn btn-primary">Return to Dashboard</a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn btn-secondary">Sign In with Different Account</button>
            </form>
        </div>
    </div>

</div>
</body>
</html>
