<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: main('System Audit Trail', ~{::content})}">
<body>
<div th:fragment="content">

    <div class="card">
        <div class="card-header">
            <div>
                <div class="card-title">Immutable Transaction Audit Trail</div>
                <div style="font-size: 0.82rem; color: var(--text-dim);">Legacy speccs.TBSC_EVENTS & speccs.TBSC_EXCEPTIONLOG Engine</div>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Operator</th>
                    <th>Action</th>
                    <th>Target Entity</th>
                    <th>Entity Key</th>
                    <th>Audit Details</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${auditPage.content}">
                    <td th:text="${a.timestamp}">Time</td>
                    <td><strong th:text="${a.username}" style="color: var(--primary);">admin</strong></td>
                    <td><span class="badge badge-info" th:text="${a.action}">ACTION</span></td>
                    <td th:text="${a.entityName}">Entity</td>
                    <td th:text="${a.entityId}">ID</td>
                    <td th:text="${a.details}">Details</td>
                </tr>
                <tr th:if="${auditPage.empty}">
                    <td colspan="6" style="text-align: center; color: var(--text-dim); padding: 30px;">No audit records found.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination" th:if="${auditPage.totalPages > 1}">
            <a th:if="${auditPage.hasPrevious()}"
               th:href="@{/admin/audit-logs(page=${auditPage.number - 1})}" class="page-item">&laquo; Prev</a>
            <span class="page-item active" th:text="${auditPage.number + 1}">1</span>
            <a th:if="${auditPage.hasNext()}"
               th:href="@{/admin/audit-logs(page=${auditPage.number + 1})}" class="page-item">Next &raquo;</a>
        </div>
    </div>

</div>
</body>
</html>
